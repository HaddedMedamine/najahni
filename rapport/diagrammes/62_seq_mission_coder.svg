="600.0" y="55.9" font-size="11" text-anchor="middle" fill="#1F1F1F">API NestJS</text><line x1="600" y1="74" x2="600" y2="709" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M710.0,30 a60.0,8 0 0,0 120.0,0 a60.0,8 0 0,0 -120.0,0 v40 a60.0,8 0 0,0 120.0,0 v-40" fill="#B5DEE1" stroke="#3D7F86"/><text x="770.0" y="61.9" font-size="11" text-anchor="middle" fill="#1F1F1F">Base de données</text><line x1="770" y1="74" x2="770" y2="709" stroke="#3D7F86" stroke-dasharray="5,4"/><rect x="20" y="331" width="820" height="96" fill="none" stroke="#555"/><path d="M20,331 h44 v12 l-6,8 h-38 z" fill="#EEF6F7" stroke="#555"/><text x="38.0" y="345.0" font-size="10" text-anchor="middle" fill="#1F1F1F" font-weight="bold">opt</text><rect x="40" y="115" width="780" height="34" fill="white" stroke="#555"/><path d="M40,115 h36 v12 l-6,6 h-30 z" fill="#EEF6F7" stroke="#555"/><text x="54.0" y="128.0" font-size="10" text-anchor="middle" fill="#1F1F1F" font-weight="bold">ref</text><text x="430.0" y="137.0" font-size="11" text-anchor="middle" fill="#1F1F1F">S&#x27;authentifier</text><line x1="90" y1="177" x2="260" y2="177" stroke="#3D7F86"/><path d="M250.0,181.5 L260.0,177.0 L250.0,172.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="110.9" y="162" width="128.2" height="13" fill="white" fill-opacity="0.9"/><text x="175.0" y="172.0" font-size="10" text-anchor="middle" fill="#1F1F1F">1: Ouvrir une mission</text><line x1="260" y1="211" x2="600" y2="211" stroke="#3D7F86"/><path d="M590.0,215.5 L600.0,211.0 L590.0,206.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="331.0" y="196" width="198.0" height="13" fill="white" fill-opacity="0.9"/><text x="430.0" y="206.0" font-size="10" text-anchor="middle" fill="#1F1F1F">2: GET /student/coding/levels/:id</text><line x1="600" y1="245" x2="770" y2="245" stroke="#3D7F86"/><path d="M760.0,249.5 L770.0,245.0 L760.0,240.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="539.5" y="230" width="291.1" height="13" fill="white" fill-opacity="0.9"/><text x="685.0" y="240.0" font-size="10" text-anchor="middle" fill="#1F1F1F">3: Vérifier que la mission précédente est réussie</text><line x1="600" y1="279" x2="260" y2="279" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M270.0,274.5 L260.0,279.0 L270.0,283.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="307.7" y="264" width="244.5" height="13" fill="white" fill-opacity="0.9"/><text x="430.0" y="274.0" font-size="10" text-anchor="middle" fill="#1F1F1F">4: Énoncé, indices, tests (sans solution)</text><line x1="90" y1="313" x2="260" y2="313" stroke="#3D7F86"/><path d="M250.0,317.5 L260.0,313.0 L250.0,308.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="55.6" y="298" width="238.7" height="13" fill="white" fill-opacity="0.9"/><text x="175.0" y="308.0" font-size="10" text-anchor="middle" fill="#1F1F1F">5: Écrire le code (Python ou algorithme)</text><text x="72.0" y="365.0" font-size="10" text-anchor="start" fill="#1F1F1F" font-style="italic">[algorithme en notation tunisienne]</text><path d="M260,381 h34 v20 h-34" fill="none" stroke="#3D7F86"/><path d="M270.0,396.5 L260.0,401.0 L270.0,405.5 Z" fill="#3D7F86" stroke="#3D7F86"/><text x="300.0" y="394.0" font-size="10" text-anchor="start" fill="#1F1F1F">6: Traduire l&#x27;algorithme en Python et vérifier le TDO</text><line x1="260" y1="455" x2="430" y2="455" stroke="#3D7F86"/><path d="M420.0,459.5 L430.0,455.0 L420.0,450.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="243.1" y="440" width="203.8" height="13" fill="white" fill-opacity="0.9"/><text x="345.0" y="450.0" font-size="10" text-anchor="middle" fill="#1F1F1F">7: Exécuter le code avec les tests</text><line x1="430" y1="489" x2="260" y2="489" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M270.0,484.5 L260.0,489.0 L270.0,493.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="216.9" y="474" width="256.2" height="13" fill="white" fill-opacity="0.9"/><text x="345.0" y="484.0" font-size="10" text-anchor="middle" fill="#1F1F1F">8: Résultat des tests + trace pour la scène</text><line x1="260" y1="523" x2="600" y2="523" stroke="#3D7F86"/><path d="M590.0,527.5 L600.0,523.0 L590.0,518.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="301.9" y="508" width="256.2" height="13" fill="white" fill-opacity="0.9"/><text x="430.0" y="518.0" font-size="10" text-anchor="middle" fill="#1F1F1F">9: POST /student/coding/levels/:id/attempts</text><path d="M600,549 h34 v20 h-34" fill="none" stroke="#3D7F86"/><path d="M610.0,564.5 L600.0,569.0 L610.0,573.5 Z" fill="#3D7F86" stroke="#3D7F86"/><text x="640.0" y="562.0" font-size="10" text-anchor="start" fill="#1F1F1F">10: Calculer les étoiles (lignes ou nombre d&#x27;essais)</text><line x1="600" y1="603" x2="770" y2="603" stroke="#3D7F86"/><path d="M760.0,607.5 L770.0,603.0 L760.0,598.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="536.5" y="588" width="296.9" height="13" fill="white" fill-opacity="0.9"/><text x="685.0" y="598.0" font-size="10" text-anchor="middle" fill="#1F1F1F">11: Mettre à jour CodeProgress (meilleur résultat)</text><line x1="600" y1="637" x2="260" y2="637" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M270.0,632.5 L260.0,637.0 L270.0,641.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="307.7" y="622" width="244.5" height="13" fill="white" fill-opacity="0.9"/><text x="430.0" y="632.0" font-size="10" text-anchor="middle" fill="#1F1F1F">12: Étoiles et mission suivante débloquée</text><line x1="260" y1="671" x2="90" y2="671" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M100.0,666.5 L90.0,671.0 L100.0,675.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="44.0" y="656" width="262.0" height="13" fill="white" fill-opacity="0.9"/><text x="175.0" y="666.0" font-size="10" text-anchor="middle" fill="#1F1F1F">13: Rejouer la scène et afficher les étoiles</text><text x="460.0" y="723.0" font-size="1" text-anchor="middle" fill="#1F1F1F"></text></svg>