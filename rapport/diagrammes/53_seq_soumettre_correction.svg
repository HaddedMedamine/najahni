-size="10" text-anchor="middle" fill="#1F1F1F">2: POST /student/assignments/:id/submissions</text><line x1="430" y1="245" x2="600" y2="245" stroke="#3D7F86"/><path d="M590.0,249.5 L600.0,245.0 L590.0,240.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="357.8" y="230" width="314.4" height="13" fill="white" fill-opacity="0.9"/><text x="515.0" y="240.0" font-size="10" text-anchor="middle" fill="#1F1F1F">3: Vérifier la date limite et le nombre de tentatives</text><text x="72.0" y="297.0" font-size="10" text-anchor="start" fill="#1F1F1F" font-style="italic">[délai dépassé ou tentatives épuisées]</text><line x1="430" y1="321" x2="260" y2="321" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M270.0,316.5 L260.0,321.0 L270.0,325.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="269.3" y="306" width="151.5" height="13" fill="white" fill-opacity="0.9"/><text x="345.0" y="316.0" font-size="10" text-anchor="middle" fill="#1F1F1F">4: 400 Soumission refusée</text><text x="72.0" y="355.0" font-size="10" text-anchor="start" fill="#1F1F1F" font-style="italic">[soumission acceptée]</text><line x1="430" y1="379" x2="600" y2="379" stroke="#3D7F86"/><path d="M590.0,383.5 L600.0,379.0 L590.0,374.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="395.6" y="364" width="238.7" height="13" fill="white" fill-opacity="0.9"/><text x="515.0" y="374.0" font-size="10" text-anchor="middle" fill="#1F1F1F">5: Enregistrer la soumission (SUBMITTED)</text><line x1="430" y1="413" x2="260" y2="413" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M270.0,408.5 L260.0,413.0 L270.0,417.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="269.3" y="398" width="151.5" height="13" fill="white" fill-opacity="0.9"/><text x="345.0" y="408.0" font-size="10" text-anchor="middle" fill="#1F1F1F">6: Soumission enregistrée</text><path d="M430,439 h34 v20 h-34" fill="none" stroke="#3D7F86"/><path d="M440.0,454.5 L430.0,459.0 L440.0,463.5 Z" fill="#3D7F86" stroke="#3D7F86"/><text x="470.0" y="452.0" font-s