" fill="#B5DEE1" stroke="#3D7F86"/><text x="600.0" y="61.9" font-size="11" text-anchor="middle" fill="#1F1F1F">Base de données</text><line x1="600" y1="74" x2="600" y2="733" stroke="#3D7F86" stroke-dasharray="5,4"/><rect x="20" y="343" width="650" height="358" fill="none" stroke="#555"/><path d="M20,343 h44 v12 l-6,8 h-38 z" fill="#EEF6F7" stroke="#555"/><text x="38.0" y="357.0" font-size="10" text-anchor="middle" fill="#1F1F1F" font-weight="bold">alt</text><line x1="20" y1="487" x2="670" y2="487" stroke="#555" stroke-dasharray="6,4"/><line x1="90" y1="131" x2="260" y2="131" stroke="#3D7F86"/><path d="M250.0,135.5 L260.0,131.0 L250.0,126.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="64.4" y="116" width="221.3" height="13" fill="white" fill-opacity="0.9"/><text x="175.0" y="126.0" font-size="10" text-anchor="middle" fill="#1F1F1F">1: Saisir identifiant et mot de passe</text><line x1="260" y1="165" x2="430" y2="165" stroke="#3D7F86"/><path d="M420.0,169.5 L430.0,165.0 L420.0,160.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="286.7" y="150" width="116.5" height="13" fill="white" fill-opacity="0.9"/><text x="345.0" y="160.0" font-size="10" text-anchor="middle" fill="#1F1F1F">2: POST /auth/login</text><path d="M430,191 h34 v20 h-34" fill="none" stroke="#3D7F86"/><path d="M440.0,206.5 L430.0,211.0 L440.0,215.5 Z" fill="#3D7F86" stroke="#3D7F86"/><text x="470.0" y="204.0" font-size="10" text-anchor="start" fill="#1F1F1F">3: Vérifier la limite d&#x27;essais (5/min)</text><line x1="430" y1="245" x2="600" y2="245" stroke="#3D7F86"/><path d="M590.0,249.5 L600.0,245.0 L590.0,240.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="378.2" y="230" width="273.6" height="13" fill="white" fill-opacity="0.9"/><text x="515.0" y="240.0" font-size="10" text-anchor="middle" fill="#1F1F1F">4: Chercher l&#x27;utilisateur (email ou téléphone)</text><line x1="600" y1="279" x2="430" y2="279" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M440.0,274.5 L430.0,279.0 L440.0,283.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="471.3" y="264" width="87.5" height="13" fill="white" fill-opacity="0.9"/><text x="515.0" y="274.0" font-size="10" text-anchor="middle" fill="#1F1F1F">5: Utilisateur</text><path d="M430,305 h34 v20 h-34" fill="none" stroke="#3D7F86"/><path d="M440.0,320.5 L430.0,325.0 L440.0,329.5 Z" fill="#3D7F86" stroke="#3D7F86"/><text x="470.0" y="318.0" font-size="10" text-anchor="start" fill="#1F1F1F">6: Vérifier le mot de passe (Argon2id)</text><text x="72.0" y="377.0" font-size="10" text-anchor="start" fill="#1F1F1F" font-style="italic">[identifiants invalides ou compte désactivé]</text><line x1="430" y1="401" x2="600" y2="401" stroke="#3D7F86"/><path d="M590.0,405.5 L600.0,401.0 L590.0,396.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="418.9" y="386" width="192.2" height="13" fill="white" fill-opacity="0.9"/><text x="515.0" y="396.0" font-size="10" text-anchor="middle" fill="#1F1F1F">7: Journaliser auth.login_failed</text><line x1="430" y1="435" x2="260" y2="435" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M270.0,430.5 L260.0,435.0 L270.0,439.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="257.6" y="420" width="174.7" height="13" fill="white" fill-opacity="0.9"/><text x="345.0" y="430.0" font-size="10" text-anchor="middle" fill="#1F1F1F">8: 401 Identifiants invalides</text><line x1="260" y1="469" x2="90" y2="469" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M100.0,464.5 L90.0,469.0 L100.0,473.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="81.8" y="454" width="186.4" height="13" fill="white" fill-opacity="0.9"/><text x="175.0" y="464.0" font-size="10" text-anchor="middle" fill="#1F1F1F">9: Afficher le message d&#x27;erreur</text><text x="72.0" y="503.0" font-size="10" text-anchor="start" fill="#1F1F1F" font-style="italic">[identifiants valides]</text><line x1="430" y1="527" x2="600" y2="527" stroke="#3D7F86"/><path d="M590.0,531.5 L600.0,527.0 L590.0,522.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect 