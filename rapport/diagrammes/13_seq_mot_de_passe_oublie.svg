" fill="#B5DEE1" stroke="#3D7F86"/><text x="600.0" y="61.9" font-size="11" text-anchor="middle" fill="#1F1F1F">Base de données</text><line x1="600" y1="74" x2="600" y2="725" stroke="#3D7F86" stroke-dasharray="5,4"/><rect x="706.8" y="30" width="126.4" height="44" fill="#B5DEE1" stroke="#3D7F86" rx="2"/><text x="770.0" y="55.9" font-size="11" text-anchor="middle" fill="#1F1F1F">Email / WhatsApp</text><line x1="770" y1="74" x2="770" y2="725" stroke="#3D7F86" stroke-dasharray="5,4"/><rect x="20" y="251" width="820" height="118" fill="none" stroke="#555"/><path d="M20,251 h44 v12 l-6,8 h-38 z" fill="#EEF6F7" stroke="#555"/><text x="38.0" y="265.0" font-size="10" text-anchor="middle" fill="#1F1F1F" font-weight="bold">opt</text><rect x="20" y="483" width="820" height="210" fill="none" stroke="#555"/><path d="M20,483 h44 v12 l-6,8 h-38 z" fill="#EEF6F7" stroke="#555"/><text x="38.0" y="497.0" font-size="10" text-anchor="middle" fill="#1F1F1F" font-weight="bold">alt</text><line x1="20" y1="559" x2="840" y2="559" stroke="#555" stroke-dasharray="6,4"/><line x1="90" y1="131" x2="260" y2="131" stroke="#3D7F86"/><path d="M250.0,135.5 L260.0,131.0 L250.0,126.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="76.0" y="116" width="198.0" height="13" fill="white" fill-opacity="0.9"/><text x="175.0" y="126.0" font-size="10" text-anchor="middle" fill="#1F1F1F">1: Saisir l&#x27;email ou le téléphone</text><line x1="260" y1="165" x2="430" y2="165" stroke="#3D7F86"/><path d="M420.0,169.5 L430.0,165.0 L420.0,160.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="257.6" y="150" width="174.7" height="13" fill="white" fill-opacity="0.9"/><text x="345.0" y="160.0" font-size="10" text-anchor="middle" fill="#1F1F1F">2: POST /auth/forgot-password</text><line x1="430" y1="199" x2="260" y2="199" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M270.0,194.5 L260.0,199.0 L270.0,203.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="266.4" y="184" width="157.3" height="13" fill="white" fill-opacity="0.9"/><text x="345.0" y="194.0" font-size="10" text-anchor="middle" fill="#1F1F1F">3: 200 (réponse immédiate)</text><line x1="430" y1="233" x2="600" y2="233" stroke="#3D7F86"/><path d="M590.0,237.5 L600.0,233.0 L590.0,228.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="433.5" y="218" width="163.1" height="13" fill="white" fill-opacity="0.9"/><text x="515.0" y="228.0" font-size="10" text-anchor="middle" fill="#1F1F1F">4: Chercher le compte actif</text><text x="72.0" y="285.0" font-size="10" text-anchor="start" fill="#1F1F1F" font-style="italic">[compte trouvé et pas de demande depuis 5 min]</text><line x1="430" y1="309" x2="600" y2="309" stroke="#3D7F86"/><path d="M590.0,313.5 L600.0,309.0 L590.0,304.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="360.7" y="294" width="308.5" height="13" fill="white" fill-opacity="0.9"/><text x="515.0" y="304.0" font-size="10" text-anchor="middle" fill="#1F1F1F">5: Invalider les anciens liens, créer un jeton (1 h)</text><line x1="430" y1="343" x2="770" y2="343" stroke="#3D7F86"/><path d="M760.0,347.5 L770.0,343.0 L760.0,338.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="474.8" y="328" width="250.4" height="13" fill="white" fill-opacity="0.9"/><text x="600.0" y="338.0" font-size="10" text-anchor="middle" fill="#1F1F1F">6: Envoyer le lien (email, sinon WhatsApp)</text><line x1="90" y1="397" x2="260" y2="397" stroke="#3D7F86"/><path d="M250.0,401.5 L260.0,397.0 L250.0,392.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="23.6" y="382" width="302.7" height="13" fill="white" fill-opacity="0.9"/><text x="175.0" y="392.0" font-size="10" text-anchor="middle" fill="#1F1F1F">7: Ouvrir le lien et saisir le nouveau mot de passe</text><line x1="260" y1="431" x2="430" y2="431" stroke="#3D7F86"/><path d="M420.0,435.5 L430.0,431.0 L420.0,426.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="260.5" y="416" width="168.9" height="13" fill="white" fill-opacity="0.9"/><text x="345.0" y="426.0" font-size="10" text-anchor="middle" fill="#1F1F1F">8: POST /auth/reset-password</text><line x1="430" y1="465" x2="600" y2="465" stroke="#3D7F86"/><path d="M590.0,469.5 L600.0,465.0 L590.0,460.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="378.2" y="450" width="273.6" height="13" fill="white" fill-opacity="0.9"/><text x="515.0" y="460.0" font-size="10" text-anchor="middle" fill="#1F1F1F">9: Vérifier le jeton (non utilisé, non expiré)</text><text x="72.0" y="517.0" font-size="10" text-anchor="start" fill="#1F1F1F" font-style="italic">[jeton invalide]</text><line x1="430" y1="541" x2="260" y2="541" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M270.0,536.5 L260.0,541.0 L270.0,545.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="251.8" y="526" width="186.4" height="13" fill="white" fill-opacity="0.9"/><text x="345.0" y="536.0" font-size="10" text-anchor="middle" fill="#1F1F1F">10: 400 Lien invalide ou expiré</text><text x="72.0" y="575.0" font-size="10" text-anchor="start" fill="#1F1F1F" font-style="italic">[jeton valide]</text><line x1="430" y1="599" x2="600" y2="599" stroke="#3D7F86"/><path d="M590.0,603.5 L600.0,599.0 L590.0,594.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="325.8" y="584" width="378.4" height="13" fill="white" fill-opacity="0.9"/><text x="515.0" y="594.0" font-size="10" text-anchor="middle" fill="#1F1F1F">11: Enregistrer le hash, marquer le jeton, révoquer les sessions</text><line x1="430" y1="633" x2="260" y2="633" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M270.0,628.5 L260.0,633.0 L270.0,637.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="321.6" y="618" width="46.7" height="13" fill="white" fill-opacity="0.9"/><text x="345.0" y="628.0" font-size="10" text-anchor="middle" fill="#1F1F1F">12: 200</text><line x1="260" y1="667" x2="90" y2="667" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M100.0,662.5 L90.0,667.0 L100.0,671.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="99.3" y="652" width="151.5" height="13" fill="white" fill-opacity="0.9"/><text x="175.0" y="662.0" font-size="10" text-anchor="middle" fill="#1F1F1F">13: Retour à la connexion</text><text x="460.0" y="739.0" font-size="1" text-anchor="middle" fill="#1F1F1F"></text></svg>