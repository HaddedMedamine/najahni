"white" fill-opacity="0.9"/><text x="351.6" y="160.0" font-size="10" text-anchor="middle" fill="#1F1F1F">2: Compter les élèves sans présence</text><text x="72.0" y="217.0" font-size="10" text-anchor="start" fill="#1F1F1F" font-style="italic">[appel incomplet]</text><line x1="264.4" y1="241" x2="90.0" y2="241" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M100.0,236.5 L90.0,241.0 L100.0,245.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="107.3" y="226" width="139.8" height="13" fill="white" fill-opacity="0.9"/><text x="177.2" y="236.0" font-size="10" text-anchor="middle" fill="#1F1F1F">3: 400 Terminez l&#x27;appel</text><text x="72.0" y="275.0" font-size="10" text-anchor="start" fill="#1F1F1F" font-style="italic">[appel complet]</text><line x1="264.4" y1="299" x2="438.8" y2="299" stroke="#3D7F86"/><path d="M428.8,303.5 L438.8,299.0 L428.8,294.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="278.8" y="284" width="145.6" height="13" fill="white" fill-opacity="0.9"/><text x="351.6" y="294.0" font-size="10" text-anchor="middle" fill="#1F1F1F">4: Passer la séance DONE</text><line x1="264.4" y1="333" x2="438.8" y2="333" stroke="#3D7F86"/><path d="M428.8,337.5 L438.8,333.0 L428.8,328.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="232.2" y="318" width="238.7" height="13" fill="white" fill-opacity="0.9"/><text x="351.6" y="328.0" font-size="10" text-anchor="middle" fill="#1F1F1F">5: Compter les présences de chaque élève</text><path d="M264.4,359 h34 v20 h-34" fill="none" stroke="#3D7F86"/><path d="M274.4,374.5 L264.4,379.0 L274.4,383.5 Z" fill="#3D7F86" stroke="#3D7F86"/><text x="304.4" y="372.0" font-size="10" text-anchor="start" fill="#1F1F1F">6: Repérer les élèves qui terminent leur série</text><line x1="264.4" y1="413" x2="613.2" y2="413" stroke="#3D7F86"/><path d="M603.2,417.5 L613.2,413.0 L603.2,408.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="270.0" y="398" width="337.6" height="13" fill="white" fill-opacity="0.9"/><text x="438.8" y="408.0" font-size="10" text-anchor="middle" fill="#1F1F1F">7: Mettre en file une alerte par parent d&#x27;absent (+5 min)</text><line x1="264.4" y1="447" x2="90.0" y2="447" stroke="#3D7F86" stroke-dasharray="5,4"/><path d="M100.0,442.5 L90.0,447.0 L100.0,451.5" fill="none" stroke="#3D7F86" stroke-width="1.2"/><rect x="66.6" y="432" width="221.3" height="13" fill="white" fill-opacity="0.9"/><text x="177.2" y="442.0" font-size="10" text-anchor="middle" fill="#1F1F1F">8: Séance terminée + séries terminées</text><text x="72.0" y="519.0" font-size="10" text-anchor="start" fill="#1F1F1F" font-style="italic">[toutes les 15 à 30 s, hors heures de nuit, 150 messages par jour au maximum]</text><line x1="613.2" y1="543" x2="438.8" y2="543" stroke="#3D7F86"/><path d="M448.8,538.5 L438.8,543.0 L448.8,547.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="403.7" y="528" width="244.5" height="13" fill="white" fill-opacity="0.9"/><text x="526.0" y="538.0" font-size="10" text-anchor="middle" fill="#1F1F1F">9: Prendre le prochain message en attente</text><line x1="613.2" y1="577" x2="438.8" y2="577" stroke="#3D7F86"/><path d="M448.8,572.5 L438.8,577.0 L448.8,581.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="345.5" y="562" width="360.9" height="13" fill="white" fill-opacity="0.9"/><text x="526.0" y="572.0" font-size="10" text-anchor="middle" fill="#1F1F1F">10: Vérifier qu&#x27;il est toujours utile (élève toujours absent)</text><text x="80.0" y="629.0" font-size="10" text-anchor="start" fill="#1F1F1F" font-style="italic">[devenu inutile]</text><line x1="613.2" y1="653" x2="438.8" y2="653" stroke="#3D7F86"/><path d="M448.8,648.5 L438.8,653.0 L448.8,657.5 Z" fill="#3D7F86" stroke="#3D7F86"/><rect x="464.8" y="638" width="122.4" height="13" fill="white" fill-opacity="0.9"/><text x="526.0" y="648.0" font-size="10" text-anchor="middle" fill="#1F1F1F">11: Statut CANCELLED</text><text x="80.0" y="687.0" font-size="10" text-anchor="start" fill="#1F1F1F" font-style="italic">[toujours utile]</text><line x1="613.2" y